[workspace]
resolver = "3"
members = [
    "gba_agb_font_loader_eb",
    "gba_agb_font_creation_internals",
    "gba_agb_font_eb",
    "gba_agb_font_renderer",
    "font_tester"
]

[workspace.package]
version = "0.25.1"
edition = "2024"
authors = ["Emma Britton <emmabritton@pm.me>"]
description = "Converter for font format for AGB"
license-file = "LICENSE"
repository = "https://github.com/emmabritton/agb_font_converter"
readme = "README.md"
publish = false
keywords = ["gba", "agb", "retro", "font", "gamedev"]
categories = ["game-development", "rendering"]

[workspace.dependencies]
image = { version = "0.24", default-features = false, features = ["png"] }
asefile = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false