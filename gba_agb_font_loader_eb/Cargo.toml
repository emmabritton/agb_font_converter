[package]
name = "gba_agb_font_loader"
version.workspace = true
authors.workspace = true
description = "Macros for loading EB AGB fonts from aseprite files"
edition.workspace = true
publish = true
license-file.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true

[dependencies]
gba_agb_font_creation_internals = { version = "0.25", path = "../gba_agb_font_creation_internals" }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
gba_agb_font_eb = { version = "0.25", path = "../gba_agb_font_eb" }